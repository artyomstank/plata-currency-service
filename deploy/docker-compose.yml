services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      GRPC_ADDR: ":9090"
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://api.frankfurter.app}
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      HTTP_ADDR: ":8080"
      BACKEND_ADDR: "service:9090"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      service:
        condition: service_started

volumes:
  pgdata:
