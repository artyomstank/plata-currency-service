version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    environment:
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/quotes?sslmode=disable
      GRPC_ADDR: ":9090"
      PROVIDER_BASE_URL: https://api.exchangeratesapi.io/v1
      PROVIDER_API_KEY: ${PROVIDER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    # gRPC-порт наружу не публикуется — сервис доступен только через gateway.

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      HTTP_ADDR: ":8080"
      BACKEND_ADDR: "service:9090"
    ports:
      - "8080:8080"
    depends_on:
      - service

volumes:
  pgdata:
