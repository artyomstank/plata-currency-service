syntax = "proto3";

package quotes.v1;

option go_package = "currency-quotes/internal/genpb/quotes/v1;quotesv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// QuotesService — асинхронный сервис котировок валютных пар.
service QuotesService {
  // Creates a quote update job. The optional Idempotency-Key HTTP header
  // makes repeated requests return the original job.
  rpc UpdateQuote(UpdateQuoteRequest) returns (UpdateQuoteResponse) {
    option (google.api.http) = {
      post: "/v1/quote-updates"
      body: "*"
    };
  }

  // Возвращает статус/результат конкретной задачи обновления.
  rpc GetQuoteUpdate(GetQuoteUpdateRequest) returns (GetQuoteUpdateResponse) {
    option (google.api.http) = {
      get: "/v1/quote-updates/{job_id}"
    };
  }

  // Возвращает последнее известное значение котировки пары.
  rpc GetLatestQuote(GetLatestQuoteRequest) returns (GetLatestQuoteResponse) {
    option (google.api.http) = {
      get: "/v1/quotes/latest"
    };
  }
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_PROCESSING = 2;
  JOB_STATUS_DONE = 3;
  JOB_STATUS_FAILED = 4;
}

message UpdateQuoteRequest {
  // Код пары в формате "BASE/QUOTE", например "EUR/MXN".
  string pair = 1;
}

message UpdateQuoteResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message GetQuoteUpdateRequest {
  string job_id = 1;
}

message GetQuoteUpdateResponse {
  string job_id = 1;
  string pair = 2;
  JobStatus status = 3;
  optional string price = 4; // Decimal string; present only for JOB_STATUS_DONE.
  google.protobuf.Timestamp updated_at = 5;
  // Public failure reason; present only for JOB_STATUS_FAILED.
  optional string error_message = 6;
}

message GetLatestQuoteRequest {
  string pair = 1;
}

message GetLatestQuoteResponse {
  string pair = 1;
  string price = 2;
  google.protobuf.Timestamp updated_at = 3;
}
