version: v2
# Плагины локальные (go install), чтобы генерация не зависела от сети
# в CI/офлайн-окружении. buf dep update один раз требует сети (тянет
# google/api/annotations.proto из BSR).
plugins:
  - local: protoc-gen-go
    out: internal/genpb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/genpb
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: internal/genpb
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: api/openapi
